  <body style="background-color: #030806;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker for offline shell + installability.
      // NOTE: deliberately no `controllerchange -> location.reload()` handler —
      // that pattern spins into a refresh loop on deploy (blank/bouncing page).
      // SW updates apply on the next navigation instead.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => console.log('SW registered:', registration.scope))
            .catch((error) => console.log('SW registration failed:', error));
        });
      }
    </script>
  </body>
